<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="ExploreZelda is an interactive map for finding hidden treasure, routing speedruns, 100% playthru, etc..." />
    <meta name="keywords" content="zelda, zelda map, totk map, Tears of the Kingdom map, hyrule map, totk guide, speedrun" />
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0b1220">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="@designgears">
    <meta name="twitter:title" content="ExploreZelda: Tears of the Kingdom Interactive Map">
    <meta name="twitter:description" content="ExploreZelda is an interactive map for finding hidden treasure, routing speedruns, 100% playthru, etc...">
    <meta name="twitter:image" content="https://explorezelda.com/assets/img/large.jpg">

    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="ExploreZelda: Tears of the Kingdom Interactive Map" />
    <meta property="og:site_name" content="Explore Zelda">
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://explorezelda.com/" />
    <meta property="og:image" content="https://explorezelda.com/assets/img/og.jpg" />
    <meta property="og:description" content="ExploreZelda is an interactive map for finding hidden treasure, routing speedruns, 100% playthru, etc..." />

    <link rel="icon" href="favicon.ico">
    <link rel="preload" href="/assets/fonts/HyliaSerifBeta-Regular.otf" as="font" type="font/otf" crossorigin>

    <title>ExploreZelda: Tears of the Kingdom Interactive Map</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="assets/css/custom.css" />
  </head>

  <body>
    <div id="map" aria-label="Map of Hyrule"></div>

    <!-- Top bar -->
    <header class="topbar">
      <a class="brand" href="/" aria-label="ExploreZelda home">
        <svg class="brand-mark" viewBox="0 0 100 88" aria-hidden="true"><path d="M50 0 75 44H25Z M25 44 50 88H0Z M75 44 100 88H50Z"/></svg>
        <span class="brand-name">ExploreZelda</span>
      </a>
      <button id="btn-layers" class="pill-btn" type="button" aria-controls="panel" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 16 10 5 10-5"/></svg>
        <span>Layers</span>
        <span id="layers-badge" class="badge" hidden>0</span>
      </button>
    </header>

    <!-- Realm switcher -->
    <nav class="realm-switch" aria-label="Map realm">
      <button type="button" class="realm-btn" data-realm="Sky">Sky</button>
      <button type="button" class="realm-btn" data-realm="Surface">Surface</button>
      <button type="button" class="realm-btn" data-realm="Depths">Depths</button>
    </nav>

    <!-- Layers panel (bottom sheet on mobile, side panel on desktop) -->
    <div id="scrim" class="scrim" hidden></div>
    <aside id="panel" class="panel" aria-label="Map layers" aria-hidden="true">
      <div class="panel-grip" aria-hidden="true"></div>
      <div class="panel-head">
        <h2 class="panel-title">Layers</h2>
        <div class="panel-actions">
          <button id="btn-all" class="text-btn" type="button">All</button>
          <button id="btn-none" class="text-btn" type="button">None</button>
          <button id="btn-close" class="icon-btn" type="button" aria-label="Close layers">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
      <div class="panel-search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="layer-filter" type="search" placeholder="Filter layers" autocomplete="off" spellcheck="false" aria-label="Filter layers">
      </div>
      <div id="panel-body" class="panel-body"></div>
      <div class="panel-foot">
        <label class="switch-row">
          <span class="switch-label">Scale icons with zoom</span>
          <input id="zoom-scaling" class="switch" type="checkbox" role="switch">
        </label>
        <p class="panel-hint">Open a marker and tap <b>Mark complete</b> to track progress.<span class="hover-only"> Right-click a marker to toggle it.</span></p>
      </div>
    </aside>

    <!-- Loading -->
    <div id="loading" class="loading" role="status" aria-live="polite">
      <svg class="loading-mark" viewBox="0 0 100 88" aria-hidden="true"><path d="M50 0 75 44H25Z M25 44 50 88H0Z M75 44 100 88H50Z"/></svg>
      <p class="loading-text">Loading Hyrule</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet-src.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-hash/0.2.1/leaflet-hash.js"></script>
    <script src="assets/js/Leaflet.SmoothWheelZoom.js"></script>
    <script src="assets/js/Leaflet.CanvasMarker.js"></script>
    <script src="assets/js/custom.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-06ZP4VCJQG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-06ZP4VCJQG');
    </script>
  </body>
</html>
